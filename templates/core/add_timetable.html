{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block title %}Add Timetable | {% trans 'LMS' %}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Add Timetable</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-success">Save</button>
                        <a href="{% url 'timetable_list' %}" class="btn btn-secondary float-end">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
