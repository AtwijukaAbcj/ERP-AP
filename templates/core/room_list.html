{% extends 'base.html' %}
{% block title %}Room List{% endblock %}
{% block content %}

<div class="container mt-4">
  <h3>Room List</h3>
  <a href="{% url 'add_room' %}" class="btn btn-primary mb-3">+ Add Room</a>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>#</th>
        <th>Room Name</th>
        <th>Capacity</th>
      </tr>
    </thead>
    <tbody>
      {% for room in rooms %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ room.name }}</td>
        <td>{{ room.capacity }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3">No rooms found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
