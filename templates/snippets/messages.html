{% if messages %}
<style>
    .alert-modern {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-radius: 12px;
        margin-bottom: 16px;
        border: none;
        font-weight: 500;
        animation: slideInDown 0.4s ease-out;
    }
    
    @keyframes slideInDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .alert-modern.alert-danger {
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        color: #dc2626;
        border-left: 4px solid #dc2626;
    }
    
    .alert-modern.alert-warning {
        background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        color: #d97706;
        border-left: 4px solid #d97706;
    }
    
    .alert-modern.alert-success {
        background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
        color: #059669;
        border-left: 4px solid #059669;
    }
    
    .alert-modern.alert-info {
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        color: #2563eb;
        border-left: 4px solid #2563eb;
    }
    
    .alert-modern i {
        font-size: 1.2rem;
        margin-right: 14px;
        background: none !important;
        border-radius: 0 !important;
        width: auto !important;
        height: auto !important;
    }
    
    .alert-modern .btn-close {
        margin-left: auto;
        opacity: 0.6;
        transition: opacity 0.3s ease;
    }
    
    .alert-modern .btn-close:hover {
        opacity: 1;
    }
</style>
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="alert alert-modern alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% elif message.tags == 'warning' %}
            <div class="alert alert-modern alert-warning alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% elif message.tags == 'info' %}
            <div class="alert alert-modern alert-info alert-dismissible fade show" role="alert">
                <i class="fas fa-info-circle"></i>
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% else %}
            <div class="alert alert-modern alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle"></i>
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}
    {% endfor %}
{% endif %}
