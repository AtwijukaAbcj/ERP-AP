{% load i18n %}
{% if filter.form %}

<div class="filter-wrapper">
    <form action="" method="get" class="filter-form">
        <div class="d-flex flex-wrap align-items-center gap-2">
            {% for field in filter.form %}
            <div class="filter-field">
                {{ field }}
            </div>
            {% endfor %}
            <button class="btn btn-filter" type="submit">
                <i class="fa fa-sliders"></i> {% trans 'Filter' %}
            </button>
        </div>
    </form>
</div>

<style>
    .filter-wrapper {
        background: linear-gradient(135deg, rgba(145, 76, 119, 0.03) 0%, rgba(145, 76, 119, 0.01) 100%);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 1px solid rgba(145, 76, 119, 0.08);
    }
    
    .filter-form .filter-field select,
    .filter-form .filter-field input {
        padding: 10px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        min-width: 180px;
        background: #fff;
    }
    
    .filter-form .filter-field select:focus,
    .filter-form .filter-field input:focus {
        border-color: #914c77;
        box-shadow: 0 0 0 3px rgba(145, 76, 119, 0.1);
        outline: none;
    }
    
    .btn-filter {
        padding: 10px 24px;
        background: linear-gradient(135deg, #914c77 0%, #7a3d64 100%);
        border: none;
        color: #fff;
        border-radius: 10px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
    }
    
    .btn-filter:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(145, 76, 119, 0.3);
        color: #fff;
    }
    
    .btn-filter i {
        background: none !important;
        border-radius: 0 !important;
        width: auto !important;
        height: auto !important;
    }
</style>
{% endif %}
