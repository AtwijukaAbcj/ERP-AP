{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add Faculty Admin</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="mt-3 text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-user-plus me-1"></i> Create Faculty Admin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
