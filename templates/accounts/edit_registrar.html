{% extends 'base.html' %}
{% block title %}Edit Registrar{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Edit Registrar</h2>
  <form method="post" class="needs-validation" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{% url 'list_registrars' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
