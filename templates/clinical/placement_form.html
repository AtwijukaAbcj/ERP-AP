{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-3">{% trans "Assign clinical placement" %}</h1>
    {% include 'snippets/messages.html' %}
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">{% trans "Create placement" %}</button>
                <a class="btn btn-outline-secondary" href="{% url 'clinical:placement_list' %}">{% trans "Cancel" %}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
