{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Budget{% endblock %}
{% block content %}
<div class="container mt-4 finance-form-page">
    <div class="finance-form-heading">
        <span class="finance-form-heading-icon"><i class="fas fa-chart-pie"></i></span>
        <div>
            <h2>Add Budget</h2>
            <p>Enter the department budget details for the fiscal year.</p>
        </div>
    </div>
    <div class="card finance-form-card">
        <div class="card-body">
            {% include 'snippets/messages.html' %}
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <div class="finance-form-actions">
                    <button type="submit" class="btn btn-primary">Save Budget</button>
                    <a href="{% url 'finance:budget_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
