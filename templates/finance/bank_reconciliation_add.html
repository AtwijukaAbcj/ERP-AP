{% extends 'base.html' %}
{% block title %}Add Bank Reconciliation{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Add Bank Reconciliation</h2>
    <div class="card p-4">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Reconciliation</button>
            <a href="{% url 'finance:bank_reconciliation_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
