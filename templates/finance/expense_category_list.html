{% extends 'base.html' %}
{% block title %}Expense Categories{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Expense Categories</h2>
    <a href="{% url 'finance:expense_category_add' %}" class="btn btn-primary mb-3">+ Add Category</a>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td>{{ category.name }}</td>
                    <td class="table-action-cell">
                        <div class="table-actions">
                            <a href="{% url 'finance:expense_category_edit' category.pk %}" class="btn btn-sm btn-outline-primary table-action-button" aria-label="Edit {{ category.name }}">
                                <i class="fas fa-pen-to-square" aria-hidden="true"></i>
                                <span>Edit</span>
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="2">No expense categories found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
