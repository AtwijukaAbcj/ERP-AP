{% extends 'base.html' %}
{% block title %}Manage Fee Categories{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Fee Categories</h2>
    <a href="{% url 'finance:fee_category_add' %}" class="btn btn-primary mb-3">+ Add Category</a>
    <table class="table">
        <thead>
            <tr><th>Name</th><th>Description</th><th>Amount</th></tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td>{{ category.description }}</td>
                <td>{{ category.amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
