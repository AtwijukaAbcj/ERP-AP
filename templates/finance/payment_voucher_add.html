{% extends 'base.html' %}
{% block title %}Add Payment Voucher{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Add Payment Voucher</h2>
    <div class="card p-4">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Voucher</button>
            <a href="{% url 'finance:payment_voucher_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
